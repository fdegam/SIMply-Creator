<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIMply Creator</title>
  <meta name="description" content="Generador de figuras humanas de línea para arquitectura: personaliza cuerpo, cara, ropa, profesión y movilidad reducida, y exporta el SIM como bloque de AutoCAD o SVG.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l9 14-9 14-9-14z' fill='%2362d96b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app2d.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-body" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="3"/><path d="M8 22v-7.5a4 4 0 0 1 8 0V22M8.5 22h7"/></symbol>
      <symbol id="i-hair" viewBox="0 0 24 24"><path d="M5 14a7 7 0 0 1 14 0v4h-3.5v-5c-3.5 0-6.5-1.5-7.5-4.5C7 11 6 12.5 5 14z"/></symbol>
      <symbol id="i-face" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/><path d="M8.5 14.5c2 2 5 2 7 0"/></symbol>
      <symbol id="i-clothes" viewBox="0 0 24 24"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></symbol>
      <symbol id="i-profession" viewBox="0 0 24 24"><path d="M4 16.5a8 8 0 0 1 16 0z"/><path d="M2 19h20M12 5.5v5"/></symbol>
      <symbol id="i-accessory" viewBox="0 0 24 24"><path d="M3 15c0-2 4-3.5 9-3.5S21 13 21 15s-4 2.5-9 2.5S3 17 3 15z"/><path d="M7 12c0-4 2-6.5 5-6.5s5 2.5 5 6.5"/></symbol>
      <symbol id="i-mobility" viewBox="0 0 24 24"><circle cx="10" cy="4.5" r="1.8"/><path d="M10 7.5v6h5l3 6M10 10.5h4.5"/><path d="M7.5 12.5a5.5 5.5 0 1 0 7.5 7.5"/></symbol>
      <symbol id="i-style" viewBox="0 0 24 24"><path d="M4 20L18 6l-2-2L2 18z"/><path d="M14 4l6 6M3 21h18"/></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r="1.1" fill="currentColor"/><circle cx="15" cy="15" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="15" cy="9" r="1.1" fill="currentColor"/><circle cx="9" cy="15" r="1.1" fill="currentColor"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4.5 12H15a5 5 0 0 1 0 10h-3" transform="translate(0 -3)"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M19.5 12H9a5 5 0 0 0 0 10h3" transform="translate(0 -3)"/></symbol>
      <symbol id="i-weight" viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></symbol>
      <symbol id="i-height" viewBox="0 0 24 24"><path d="M12 3v18M8 7l4-4 4 4M8 17l4 4 4-4"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    </defs>
  </svg>

  <div class="sim">
    <main class="stage">
      <header class="name-pill">
        <span class="plumb" aria-hidden="true"></span>
        <input id="name" type="text" value="Mi SIM" maxlength="28" aria-label="Nombre del SIM" spellcheck="false">
      </header>

      <div class="views" role="radiogroup" aria-label="Vista" id="views"></div>

      <div class="paper"><div id="preview" class="preview" role="img" aria-label="Vista previa del SIM"></div></div>

      <div class="sliders" role="group" aria-label="Cuerpo">
        <label class="slider" title="Complexión"><svg class="ic"><use href="#i-weight"/></svg>
          <input id="s-weight" type="range" min="-1" max="1" step="0.05" value="0" aria-label="Complexión">
        </label>
        <label class="slider" title="Estatura"><svg class="ic"><use href="#i-height"/></svg>
          <input id="s-stature" type="range" min="-1" max="1" step="0.05" value="0" aria-label="Estatura">
        </label>
      </div>

      <div class="top-actions">
        <button id="btn-dxf" class="pill strong" title="Bloque de AutoCAD (.dxf): BLOCK + INSERT con atributos">Bloque DXF</button>
        <button id="btn-svg" class="pill" title="Dibujo vectorial (.svg)">SVG</button>
      </div>

      <div class="bar" role="toolbar" aria-label="Acciones">
        <button id="btn-random" class="round sm" title="Aleatorizar"><svg class="ic"><use href="#i-dice"/></svg></button>
        <button id="btn-undo" class="round sm" title="Deshacer (Ctrl+Z)" disabled><svg class="ic"><use href="#i-undo"/></svg></button>
        <button id="btn-redo" class="round sm" title="Rehacer (Ctrl+Mayús+Z)" disabled><svg class="ic"><use href="#i-redo"/></svg></button>
      </div>
      <p id="note" class="note" role="status" aria-live="polite"></p>

      <button id="btn-reset" class="round cancel" title="Resetear"><svg class="ic"><use href="#i-close"/></svg></button>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <aside class="side">
      <nav id="arc" class="arc" aria-label="Categorías"></nav>
      <section class="panel">
        <h2 id="panel-title">Cuerpo</h2>
        <div id="panel-body" class="panel-body"></div>
      </section>
    </aside>
  </div>

  <p class="loading" id="loading">Cargando el kit de piezas…</p>
  <script type="module" src="js/app2d.js"></script>
</body>
</html>
